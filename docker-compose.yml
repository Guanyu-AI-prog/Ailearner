services:
  ailearner:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./ailearner.db:/app/ailearner.db
      - ./knowledge/data:/app/knowledge/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
