{% extends "base.html" %}
{% block title %}AI 学习引路人 - 对话{% endblock %}
{% block content %}
<div class="chat-container">
    <div class="chat-header">
        <h2>AI 学习引路人</h2>
        <p>告诉我你的情况，我来帮你规划</p>
    </div>
    <div class="chat-messages" id="chat-messages">
        <div class="message assistant">
            <div class="message-content">
                <p>你好！我是 AI 学习引路人</p>
                <p>想了解一下 AI 学习？你可以：</p>
                <ul>
                    <li>直接说 <strong>"帮我评估"</strong>，我通过几个问题帮你判断方向</li>
                    <li>或者直接问任何 AI 学习相关的问题</li>
                </ul>
                <p>从哪里开始都可以，我们聊聊？</p>
            </div>
        </div>
    </div>
    <div class="chat-input">
        <textarea id="user-input" rows="2" placeholder="输入你的问题..." onkeydown="handleKeyDown(event)"></textarea>
        <button id="send-btn" onclick="sendMessage()">发送</button>
    </div>
</div>
{% endblock %}
